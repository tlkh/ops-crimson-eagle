<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aircraft inspection · Ops Crimson Eagle</title>
  <link rel="icon" href="data:,">
  <style>
    html,body{margin:0;height:100%;background:#26332f;color:#f2f3ec;font:14px system-ui}
    body{display:flex;flex-direction:column}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px}
    label{display:flex;align-items:center;gap:6px}select,button{font:inherit;color:inherit;background:#35483e;border:1px solid #829787;padding:6px}
    #scene{position:relative;flex:1;min-height:0}canvas{display:block;width:100%;height:100%}
    .view-label{position:absolute;pointer-events:none;color:white;padding:10px;font-size:12px;text-shadow:0 1px 4px #000}
    output{position:absolute;bottom:8px;left:8px;padding:8px;background:#10201bda;white-space:pre;font:11px monospace;pointer-events:none}
  </style>
</head>
<body>
  <header>
    <strong>Aircraft inspection</strong>
    <label>Campaign <select id="campaign"><option value="sg">RSAF CH-47F</option><option value="jp">JGSDF CH-47JA</option></select></label>
    <label>View <select id="view"><option value="sheet">Six views</option><option>port</option><option>starboard</option><option>front</option><option>rear</option><option>top</option><option value="front-quarter">Front quarter</option><option value="rear-quarter">Rear quarter</option><option>underside</option><option>gear</option></select></label>
    <label>Light <select id="light"><option>day</option><option>dusk</option><option>night</option></select></label>
    <label>Rotors <select id="rotors"><option>stopped</option><option>slow</option><option>flight</option></select></label>
    <button id="pause">Resume</button>
  </header>
  <div id="scene"><output id="metrics">Loading aircraft…</output></div>
  <script type="module" src="./preview.ts"></script>
</body>
</html>
